    <pre id="error-box" style="display:none;margin-top:16px;text-align:left;background:#F4DEDB;color:#B23A2E;padding:12px;border-radius:8px;font-size:11px;max-width:100%;overflow:auto;white-space:pre-wrap;"></pre>
  </div>
</div>
<script>
  window.onerror = function (message, source, lineno, colno, error) {
    var box = document.getElementById("error-box");
    if (box) {
      box.style.display = "block";
      box.textContent = "Erreur : " + message + "\n(ligne " + lineno + ")";
    }
    return false;
  };
  setTimeout(function () {
    var box = document.getElementById("error-box");
    if (box && document.getElementById("fallback") && !box.textContent) {
      box.style.display = "block";
      box.textContent = "Le chargement prend trop de temps. Vérifiez votre connexion internet, ou essayez avec le WiFi plutôt que les données mobiles (ou l'inverse).";
    }
  }, 15000);
</script>

function resizeImage(file, maxWidth = 700, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function SignaturePad({ value, onChange }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (value) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height); img.src = value; }
  }, []);
  const pos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  };
  const start = (e) => { drawing.current = true; const { x, y } = pos(e); const ctx = canvasRef.current.getContext("2d"); ctx.beginPath(); ctx.moveTo(x, y); };
  const move = (e) => { if (!drawing.current) return; e.preventDefault(); const { x, y } = pos(e); const ctx = canvasRef.current.getContext("2d"); ctx.lineTo(x, y); ctx.strokeStyle = c.ink; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.stroke(); };
  const end = () => { if (!drawing.current) return; drawing.current = false; onChange(canvasRef.current.toDataURL("image/png")); };
  const clear = () => { const canvas = canvasRef.current; const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); onChange(null); };
  return (
    <div>
      <canvas ref={canvasRef} width={420} height={140} className="w-full border rounded-md touch-none" style={{ borderColor: c.line, background: "#fff", cursor: "crosshair" }}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end} onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
      <button type="button" onClick={clear} className="mt-2 text-xs underline" style={{ color: c.muted }}>Effacer la signature</button>
    </div>
  );
}

  const [saveError, setSaveError] = useState("");
  const [saving, setSaving] = useState(false);

  const updateUE = (index, patch) => setData((d) => { const list = [...d.unitesExterieures]; list[index] = { ...list[index], ...patch }; return { ...d, unitesExterieures: list, updatedAt: todayISO() }; });
  const addUE = () => setData((d) => ({ ...d, unitesExterieures: [...d.unitesExterieures, newUniteExterieure()] }));
  const removeUE = (index) => setData((d) => ({ ...d, unitesExterieures: d.unitesExterieures.filter((_, i) => i !== index) }));
  const updateUI = (ueIndex, uiIndex, patch) => setData((d) => { const list = [...d.unitesExterieures]; const uis = [...list[ueIndex].unitesInterieures]; uis[uiIndex] = { ...uis[uiIndex], ...patch }; list[ueIndex] = { ...list[ueIndex], unitesInterieures: uis }; return { ...d, unitesExterieures: list, updatedAt: todayISO() }; });
  const addUI = (ueIndex) => setData((d) => { const list = [...d.unitesExterieures]; list[ueIndex] = { ...list[ueIndex], unitesInterieures: [...list[ueIndex].unitesInterieures, newUniteInterieure()] }; return { ...d, unitesExterieures: list }; });
  const removeUI = (ueIndex, uiIndex) => setData((d) => { const list = [...d.unitesExterieures]; list[ueIndex] = { ...list[ueIndex], unitesInterieures: list[ueIndex].unitesInterieures.filter((_, i) => i !== uiIndex) }; return { ...d, unitesExterieures: list }; });
  const updateFourniture = (index, patch) => setData((d) => { const list = [...d.fournitures]; list[index] = { ...list[index], ...patch }; return { ...d, fournitures: list }; });
  const addFourniture = () => setData((d) => ({ ...d, fournitures: [...d.fournitures, { id: uid(), designation: "", quantite: "1", validation: "Ok" }] }));

      setTimeout(() => setSavedFlash(false), 2000);
      if (status === "finalise" && onFinalized) onFinalized(toSave);
    } else {
      setSaveError(lastSaveError || "Erreur inconnue lors de l'enregistrement.");
    }
  };

  return (
    <div className="max-w-4xl mx-auto px-6 py-8 pb-28">
      <button onClick={onCancel} className="inline-flex items-center gap-1 text-sm font-medium mb-6" style={{ color: c.muted }}><IArrowLeft size={15} /> Retour au tableau de bord</button>
      <div className="flex items-center justify-between mb-8">
        <div>
          <p className="text-xs font-semibold uppercase mb-1" style={{ color: c.copper, letterSpacing: "0.1em" }}>Fiche de visite technique</p>
          <h1 className="text-2xl font-bold" style={{ ...display, color: c.ink }}>N° {data.numero}</h1>
        </div>
        <Badge tone={data.status === "finalise" ? "success" : "muted"}>{STATUTS[data.status]}</Badge>
      </div>

      <Card>
        <SectionHeader n={1} title="Informations générales" subtitle="Identification du client et de l'intervention" />
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Installateur"><TextInput value={data.installateur} onChange={(e) => set({ installateur: e.target.value })} /></Field>
          <Field label="Technicien"><TextInput value={data.technicien} onChange={(e) => set({ technicien: e.target.value })} /></Field>
          <Field label="Client"><TextInput value={data.client} onChange={(e) => set({ client: e.target.value })} placeholder="Nom du client" /></Field>
          <Field label="Date de la visite technique"><TextInput type="date" value={data.dateVT} onChange={(e) => set({ dateVT: e.target.value })} /></Field>
          <div className="sm:col-span-2"><Field label="Adresse"><TextInput value={data.adresse} onChange={(e) => set({ adresse: e.target.value })} placeholder="Adresse complète du chantier" /></Field></div>
        </div>
      </Card>

      <Card>
        <SectionHeader n={2} title="Installation électrique" subtitle="Tableau électrique et alimentation" accent="steel" />
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <Field label="Surface habitable totale (m²)"><TextInput type="number" value={data.surfaceHabitable} onChange={(e) => set({ surfaceHabitable: e.target.value })} /></Field>
          <Field label="Tension d'alimentation actuelle"><SelectInput value={data.tension} onChange={(v) => set({ tension: v })} options={TENSIONS} /></Field>
          <Field label="Section du câble disjoncteur → TGBT (mm²)"><TextInput value={data.sectionCable} onChange={(e) => set({ sectionCable: e.target.value })} placeholder="ex : 16²" /></Field>
          <Field label="TGBT dispose d'un inter différentiel ?"><ToggleOuiNon value={data.tgbtDiff} onChange={(v) => set({ tgbtDiff: v })} /></Field>
          <Field label="Remplacer le câble d'alimentation du TGBT ?"><ToggleOuiNon value={data.remplacementCable} onChange={(v) => set({ remplacementCable: v })} /></Field>
          <Field label="Mise à la terre conforme à la norme ?"><ToggleOuiNon value={data.miseATerre} onChange={(v) => set({ miseATerre: v })} /></Field>
        </div>
        <PhotoUpload label="Photo du tableau électrique principal ouvert" value={data.photoTableau} onChange={(v) => set({ photoTableau: v })} />
      </Card>

      <Card>
        <SectionHeader n={3} title="Unités extérieures & intérieures" subtitle="Une unité extérieure peut alimenter plusieurs unités intérieures" />
        <div className="flex flex-col gap-6">
          {data.unitesExterieures.map((ue, ueIndex) => (
            <div key={ue.id} className="rounded-lg border-2" style={{ borderColor: c.copper }}>
              <div className="flex items-center justify-between px-4 py-3" style={{ background: c.copperTint }}>
                <div className="flex items-center gap-2"><IWind size={16} style={{ color: c.copperDark }} /><span className="font-bold text-sm" style={{ color: c.copperDark, ...display }}>Unité extérieure {ueIndex + 1}</span></div>
                {data.unitesExterieures.length > 1 && <button onClick={() => removeUE(ueIndex)} className="text-xs font-medium underline" style={{ color: c.danger }}>Supprimer</button>}
              </div>
              <div className="p-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                  <Field label="Exposition"><SelectInput value={ue.exposition} onChange={(v) => updateUE(ueIndex, { exposition: v })} options={EXPOSITIONS} /></Field>
                  <Field label="Hauteur de pose (m)"><TextInput type="number" step="0.1" value={ue.hauteurPose} onChange={(e) => updateUE(ueIndex, { hauteurPose: e.target.value })} /></Field>
                  <Field label="Type de support"><SelectInput value={ue.typeSupport} onChange={(v) => updateUE(ueIndex, { typeSupport: v })} options={TYPES_SUPPORT} /></Field>
                  {ue.typeSupport === "Rubber foot" ? <Field label="Dalle béton de niveau"><SelectInput value={ue.dalleBeton} onChange={(v) => updateUE(ueIndex, { dalleBeton: v })} options={DALLE_OPTIONS} /></Field> : <Field label="Nature du mur"><SelectInput value={ue.natureMur} onChange={(v) => updateUE(ueIndex, { natureMur: v })} options={NATURES_MUR} /></Field>}
                  <Field label="Longueur câble électrique (m)"><TextInput type="number" value={ue.longueurCableElec} onChange={(e) => updateUE(ueIndex, { longueurCableElec: e.target.value })} /></Field>
                  <Field label="Longueur totale de liaison frigorifique (m)"><TextInput type="number" value={ue.longueurLiaisonFrigoTotale} onChange={(e) => updateUE(ueIndex, { longueurLiaisonFrigoTotale: e.target.value })} /></Field>
                  <div className="sm:col-span-2"><Field label="Respect des préconisations (distances autour de l'UE)"><ToggleOuiNon value={ue.respectPreco} onChange={(v) => updateUE(ueIndex, { respectPreco: v })} /></Field></div>
                </div>
                <PhotoUpload label="Emplacement façade (recul de 2m)" value={ue.photo} onChange={(v) => updateUE(ueIndex, { photo: v })} />
                <div className="flex items-center gap-2 my-4 pl-2">
                  <div className="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0" style={{ borderColor: c.steel }}><div className="w-2 h-2 rounded-full" style={{ background: c.steel }} /></div>
                  <div className="flex-1 border-t-2 border-dashed" style={{ borderColor: c.steel }} />
                  <span className="text-xs font-semibold uppercase shrink-0" style={{ color: c.steel, letterSpacing: "0.06em" }}>Liaisons frigorifiques</span>
                  <div className="flex-1 border-t-2 border-dashed" style={{ borderColor: c.steel }} />
                </div>
                <div className="flex flex-col gap-4 pl-2 sm:pl-6">
                  {ue.unitesInterieures.map((ui, uiIndex) => (
                    <div key={ui.id} className="rounded-lg border" style={{ borderColor: c.steel }}>
                      <div className="flex items-center justify-between px-4 py-2.5" style={{ background: c.steelTint }}>
                        <div className="flex items-center gap-2"><IThermo size={15} style={{ color: c.steelDark }} /><span className="font-semibold text-sm" style={{ color: c.steelDark }}>Unité intérieure {uiIndex + 1}</span></div>
                        {ue.unitesInterieures.length > 1 && <button onClick={() => removeUI(ueIndex, uiIndex)} className="text-xs font-medium underline" style={{ color: c.danger }}>Supprimer</button>}
                      </div>
                      <div className="p-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                          <Field label="Type d'unité"><SelectInput value={ui.typeUnite} onChange={(v) => updateUI(ueIndex, uiIndex, { typeUnite: v })} options={TYPES_UNITE} /></Field>
                          <Field label="Pièce concernée"><TextInput value={ui.pieceConcernee} onChange={(e) => updateUI(ueIndex, uiIndex, { pieceConcernee: e.target.value })} placeholder="ex : Salon, Chambre 1…" /></Field>
                          <Field label="Hauteur sous plafond (m)"><TextInput type="number" step="0.1" value={ui.hauteurPlafond} onChange={(e) => updateUI(ueIndex, uiIndex, { hauteurPlafond: e.target.value })} /></Field>
                          <Field label="Surface de la pièce (m²)"><TextInput type="number" value={ui.surfacePiece} onChange={(e) => updateUI(ueIndex, uiIndex, { surfacePiece: e.target.value })} /></Field>
                          <Field label="Longueur liaison frigorifique (m)"><TextInput type="number" value={ui.longueurLiaisonFrigo} onChange={(e) => updateUI(ueIndex, uiIndex, { longueurLiaisonFrigo: e.target.value })} /></Field>
                          <Field label="Nature du mur"><SelectInput value={ui.natureMur} onChange={(v) => updateUI(ueIndex, uiIndex, { natureMur: v })} options={NATURES_MUR} /></Field>
                          <Field label="Niveau de difficulté de percement"><SelectInput value={ui.difficultePercement} onChange={(v) => updateUI(ueIndex, uiIndex, { difficultePercement: v })} options={DIFFICULTES} /></Field>
                          <Field label="Pompe de relevage"><SelectInput value={ui.pompeRelevage} onChange={(v) => updateUI(ueIndex, uiIndex, { pompeRelevage: v })} options={POMPE_OPTIONS} /></Field>
                          <Field label="Détuilage"><ToggleOuiNon value={ui.detuilage} onChange={(v) => updateUI(ueIndex, uiIndex, { detuilage: v })} /></Field>
                          <Field label="Respect des préconisations autour de l'UI"><ToggleOuiNon value={ui.respectPreco} onChange={(v) => updateUI(ueIndex, uiIndex, { respectPreco: v })} /></Field>
                        </div>
                        <PhotoUpload label="Emplacement de l'unité dans la pièce" value={ui.photo} onChange={(v) => updateUI(ueIndex, uiIndex, { photo: v })} />
                        <div className="mt-4"><Field label="Commentaire de pose pour l'unité"><TextArea value={ui.commentaire} onChange={(e) => updateUI(ueIndex, uiIndex, { commentaire: e.target.value })} /></Field></div>
                      </div>
                    </div>
                  ))}
                  <button onClick={() => addUI(ueIndex)} className="self-start inline-flex items-center gap-1.5 text-sm font-semibold" style={{ color: c.steelDark }}><IPlus size={14} /> Ajouter une unité intérieure</button>
                </div>
              </div>
            </div>
          ))}
          <button onClick={addUE} className="self-start inline-flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold" style={{ background: c.copperTint, color: c.copperDark }}><IPlus size={15} /> Ajouter une unité extérieure</button>
        </div>
        <div className="mt-6 pt-4 border-t" style={{ borderColor: c.lineSoft }}>
          <Field label="Souhaitez-vous poser des radiateurs électriques ?"><ToggleOuiNon value={data.radiateursElectriques} onChange={(v) => set({ radiateursElectriques: v })} /></Field>
        </div>
      </Card>

      <Card>
        <SectionHeader n={4} title="Commande de matériel" subtitle="Liste des fournitures pour le devis" accent="steel" />
        <div className="flex flex-col gap-2">
          <div className="hidden sm:grid grid-cols-12 gap-2 text-xs font-semibold uppercase px-1" style={{ color: c.mutedSoft, letterSpacing: "0.06em" }}>
            <span className="col-span-7">Fourniture</span><span className="col-span-2">Quantité</span><span className="col-span-2">Validation</span>
          </div>
          {data.fournitures.map((f, i) => (
            <div key={f.id} className="grid grid-cols-12 gap-2 items-center">
              <div className="col-span-12 sm:col-span-7"><TextInput value={f.designation} onChange={(e) => updateFourniture(i, { designation: e.target.value })} placeholder="ex : Groupe extérieur inverter multi-split…" /></div>
              <div className="col-span-5 sm:col-span-2"><TextInput type="number" value={f.quantite} onChange={(e) => updateFourniture(i, { quantite: e.target.value })} /></div>
              <div className="col-span-5 sm:col-span-2"><SelectInput value={f.validation} onChange={(v) => updateFourniture(i, { validation: v })} options={["Ok", "En attente", "À revoir"]} /></div>
              <div className="col-span-2 sm:col-span-1 flex justify-end"><button onClick={() => removeFourniture(i)} className="rounded-md p-2" style={{ background: c.dangerTint, color: c.danger }}><ITrash size={14} /></button></div>
            </div>
          ))}
          <button onClick={addFourniture} className="self-start inline-flex items-center gap-1.5 text-sm font-semibold mt-1" style={{ color: c.copperDark }}><IPlus size={14} /> Ajouter une fourniture</button>
        </div>
      </Card>

      <Card>
        <SectionHeader n={5} title="Remarques et signature" subtitle="Finalisation de la fiche de visite" />
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div className="sm:col-span-2"><Field label="Remarques générales"><TextArea value={data.remarquesGenerales} onChange={(e) => set({ remarquesGenerales: e.target.value })} /></Field></div>
          <div className="sm:col-span-2"><Field label="Autres commentaires pour le chargé d'affaires"><TextArea value={data.autresCommentaires} onChange={(e) => set({ autresCommentaires: e.target.value })} /></Field></div>
          <Field label="Souhaitez-vous être recontacté par le chargé d'affaires ?"><ToggleOuiNon value={data.recontacte} onChange={(v) => set({ recontacte: v })} /></Field>
          <Field label="Voulez-vous joindre des photos supplémentaires ?"><ToggleOuiNon value={data.photosSupp} onChange={(v) => set({ photosSupp: v })} /></Field>
          <Field label="Date provisoire de chantier (vue avec le client)"><TextInput type="date" value={data.dateProvisoireChantier} onChange={(e) => set({ dateProvisoireChantier: e.target.value })} /></Field>
        </div>
        <Field label="Signature du technicien"><SignaturePad value={data.signature} onChange={(v) => set({ signature: v })} /></Field>
      </Card>

      <div className="fixed bottom-0 left-0 right-0 border-t bg-white px-6 py-3 flex items-center justify-between gap-3" style={{ borderColor: c.line }}>
        <span className="text-xs flex-1" style={{ color: saveError ? c.danger : (savedFlash ? c.success : c.mutedSoft) }}>
          {saveError ? `⚠ ${saveError}` : savedFlash ? "✓ Enregistré" : saving ? "Enregistrement…" : `Dernière modification : ${formatDateFR(data.updatedAt)}`}
        </span>
        <div className="flex gap-2 shrink-0">
          <button disabled={saving} onClick={() => doSave("brouillon")} className="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold" style={{ background: c.lineSoft, color: c.text, opacity: saving ? 0.6 : 1 }}><ISave size={15} /> Enregistrer le brouillon</button>
          <button disabled={saving} onClick={() => doSave("finalise")} className="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold" style={{ background: c.copper, color: "#fff", opacity: saving ? 0.6 : 1 }}><ICheck size={15} /> Finaliser la fiche</button>
        </div>
      </div>
    </div>
  );
}

/* ================================================================== */
/*  FICHE DÉTAIL / IMPRESSION                                           */
/* ================================================================== */
function Pill({ v }) {
  if (!v) return null;
  return <span className={"rp-pill" + (v === "Oui" ? " yes" : "")}>{v}</span>;
}
function KV({ label, value, pill }) {
  if (!value) return null;
  return (
    <div className="rp-kv-item">
      <span className="k">{label}</span>
      <span className="v">{pill ? <Pill v={value} /> : value}</span>
    </div>
  );
}
function RpPhoto({ src, caption }) {
  if (!src) return null;
  return <div className="rp-photo"><img src={src} alt={caption} /><div className="cap">{caption}</div></div>;
}
function RpSection({ n, title, tone, children }) {
  return (
    <div className="rp-sec">
      <div className={"rp-sec-title" + (tone === "steel" ? " steel" : "")}><span className="n">{n}</span>{title}</div>
      {children}
    </div>
  );
}
function DetailView({ data, company, onBack, onEdit }) {
  const { ue: ueCount, ui: uiCount } = countUnits(data);
  const co = company || {};
  const brandName = co.nom || "Klimacool";
  const fournitures = (data.fournitures || []).filter((f) => f.designation);
  return (
    <div>
      <div className="max-w-4xl mx-auto px-6 pt-8 flex items-center justify-between print-hide">
        <button onClick={onBack} className="inline-flex items-center gap-1 text-sm font-medium" style={{ color: c.muted }}><IArrowLeft size={15} /> Retour</button>
        <div className="flex gap-2">
          <button onClick={onEdit} className="inline-flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold" style={{ background: c.lineSoft, color: c.text }}><IPencil size={14} /> Modifier</button>
          <button onClick={() => window.print()} className="inline-flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold" style={{ background: c.copper, color: "#fff" }}><IPrinter size={14} /> Imprimer / PDF</button>
        </div>
      </div>

      <div id="print-area" className="rp">
        {/* En-tête : logo + coordonnées / titre du document */}
        <div className="rp-head">
          <div className="rp-brand">
            {co.logo && <img src={co.logo} alt="Logo" />}
            <div>
              <div className="rp-brand-name">{brandName}</div>
              <div className="rp-brand-txt">
                {co.adresse && <div>{co.adresse}</div>}
                {(co.telephone || co.email) && <div>{[co.telephone, co.email].filter(Boolean).join(" · ")}</div>}
                {co.siret && <div>SIRET {co.siret}</div>}
              </div>
            </div>
          </div>
          <div className="rp-doc">
            <div className="kicker">Rapport d'intervention</div>
            <h1>Visite technique<br />PAC Air / Air</h1>
            <div className="meta">N° {data.numero} · {formatDateFR(data.dateVT)}</div>
          </div>
        </div>

        {/* Bloc client / intervenants */}
        <div className="rp-info">
          <div><div className="k">Client</div><div className="v">{data.client || "—"}</div></div>
          <div><div className="k">Adresse du chantier</div><div className="v">{data.adresse || "—"}</div></div>
          <div><div className="k">Technicien</div><div className="v">{data.technicien || "—"}</div></div>
          <div><div className="k">Installateur</div><div className="v">{data.installateur || "—"}</div></div>
        </div>
        <div className="rp-chips">
          <span className="rp-chip">{ueCount} unité{ueCount > 1 ? "s" : ""} extérieure{ueCount > 1 ? "s" : ""}</span>
          <span className="rp-chip">{uiCount} unité{uiCount > 1 ? "s" : ""} intérieure{uiCount > 1 ? "s" : ""}</span>
          {data.surfaceHabitable && <span className="rp-chip">{data.surfaceHabitable} m² habitables</span>}
          {data.tension && <span className="rp-chip">{data.tension}</span>}
        </div>

        {/* 1. Installation électrique */}
        <RpSection n={1} title="Installation électrique" tone="steel">
          <div className="rp-split">
            <div className="grow">
              <div className="rp-kv">
                <KV label="Surface habitable totale" value={data.surfaceHabitable ? `${data.surfaceHabitable} m²` : ""} />
                <KV label="Tension d'alimentation" value={data.tension} />
                <KV label="Section câble disjoncteur → TGBT" value={data.sectionCable} />
                <KV label="TGBT avec inter différentiel" value={data.tgbtDiff} pill />
                <KV label="Remplacement câble TGBT" value={data.remplacementCable} pill />
                <KV label="Mise à la terre conforme" value={data.miseATerre} pill />
              </div>
            </div>
            <RpPhoto src={data.photoTableau} caption="Tableau électrique principal" />
          </div>
        </RpSection>

        {/* 2. Unités */}
        <RpSection n={2} title="Unités extérieures et intérieures">
          {data.unitesExterieures.map((ue, i) => (
            <div key={ue.id} className="rp-card">
              <div className="rp-card-h">Unité extérieure {i + 1}</div>
              <div className="rp-card-b">
                <div className="rp-split">
                  <div className="grow">
                    <div className="rp-kv">
                      <KV label="Exposition" value={ue.exposition} />
                      <KV label="Hauteur de pose" value={ue.hauteurPose ? `${ue.hauteurPose} m` : ""} />
                      <KV label="Type de support" value={ue.typeSupport} />
                      {ue.typeSupport === "Rubber foot" ? <KV label="Dalle béton" value={ue.dalleBeton} /> : <KV label="Nature du mur" value={ue.natureMur} />}
                      <KV label="Câble électrique" value={ue.longueurCableElec ? `${ue.longueurCableElec} m` : ""} />
                      <KV label="Liaison frigorifique totale" value={ue.longueurLiaisonFrigoTotale ? `${ue.longueurLiaisonFrigoTotale} m` : ""} />
                      <KV label="Préconisations respectées" value={ue.respectPreco} pill />
                    </div>
                  </div>
                  <RpPhoto src={ue.photo} caption="Emplacement façade" />
                </div>

                {ue.unitesInterieures.map((ui, j) => (
                  <div key={ui.id} className="rp-sub">
                    <div className="rp-card-h steel">Unité intérieure {j + 1}{ui.pieceConcernee ? ` — ${ui.pieceConcernee}` : ""}</div>
                    <div className="rp-card-b">
                      <div className="rp-split">
                        <div className="grow">
                          <div className="rp-kv">
                            <KV label="Type d'unité" value={ui.typeUnite} />
                            <KV label="Hauteur sous plafond" value={ui.hauteurPlafond ? `${ui.hauteurPlafond} m` : ""} />
                            <KV label="Surface de la pièce" value={ui.surfacePiece ? `${ui.surfacePiece} m²` : ""} />
                            <KV label="Liaison frigorifique" value={ui.longueurLiaisonFrigo ? `${ui.longueurLiaisonFrigo} m` : ""} />
                            <KV label="Nature du mur" value={ui.natureMur} />
                            <KV label="Difficulté de percement" value={ui.difficultePercement} />
                            <KV label="Pompe de relevage" value={ui.pompeRelevage} />
                            <KV label="Détuilage" value={ui.detuilage} pill />
                            <KV label="Préconisations respectées" value={ui.respectPreco} pill />
                          </div>
                          {ui.commentaire && <div className="rp-note" style={{ marginTop: 8 }}><span className="k">Commentaire de pose</span>{ui.commentaire}</div>}

                        <RpPhoto src={ui.photo} caption="Emplacement dans la pièce" />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}
          <div className="rp-kv"><KV label="Pose de radiateurs électriques" value={data.radiateursElectriques} pill /></div>
        </RpSection>

        {/* 3. Matériel */}
        {fournitures.length > 0 && (
          <RpSection n={3} title="Commande de matériel" tone="steel">
            <table>
              <thead><tr><th>Fourniture</th><th style={{ width: 70 }}>Qté</th><th style={{ width: 100 }}>Validation</th></tr></thead>
              <tbody>
                {fournitures.map((f) => (
                  <tr key={f.id}>
                    <td>{f.designation}</td>
                    <td style={{ fontWeight: 700 }}>{f.quantite}</td>
                    <td><span className={"rp-pill" + (f.validation === "Ok" ? " yes" : "")}>{f.validation}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </RpSection>
        )}

        {/* 4. Remarques */}
        <RpSection n={fournitures.length > 0 ? 4 : 3} title="Remarques">
          {data.remarquesGenerales && <div className="rp-note"><span className="k">Remarques générales</span>{data.remarquesGenerales}</div>}
          {data.autresCommentaires && <div className="rp-note"><span className="k">Commentaires pour le chargé d'affaires</span>{data.autresCommentaires}</div>}
          <div className="rp-kv">
            <KV label="Recontact souhaité" value={data.recontacte} pill />
            <KV label="Photos supplémentaires" value={data.photosSupp} pill />
          </div>
        </RpSection>

        {/* Signature */}
        <div className="rp-sign">
          <div className="rp-sign-box">
            <span className="k">Date provisoire de chantier</span>
            <div className="big">{data.dateProvisoireChantier ? formatDateFR(data.dateProvisoireChantier) : "À définir"}</div>
            <span className="k" style={{ marginTop: 14 }}>Visite réalisée le</span>
            <div className="big">{formatDateFR(data.dateVT)}</div>
          </div>
          <div className="rp-sign-box">
            <span className="k">Signature du technicien{data.technicien ? ` — ${data.technicien}` : ""}</span>
            {data.signature ? <img src={data.signature} alt="Signature" /> : <div style={{ color: "#9AA2AB", fontStyle: "italic", marginTop: 8 }}>Non signée</div>}
          </div>
        </div>

        <div className="rp-foot">
          {[brandName, co.adresse, co.telephone, co.siret ? `SIRET ${co.siret}` : ""].filter(Boolean).join(" · ")}
        </div>
      </div>
    </div>
  );
}

/* ================================================================== */
/*  RACINE DE L'APPLICATION                                             */
/* ================================================================== */
function App() {
  const [technicien, setTechnicien] = useState(() => localStorage.getItem("klimacool-tech-name") || null);
  const [view, setView] = useState("dashboard");
  const [interventions, setInterventions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [currentId, setCurrentId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [company, setCompany] = useState(blankCompany());

  const [listError, setListError] = useState("");
  const loadAll = useCallback(async () => {
    setLoading(true);
    try {
      const items = await listInterventions();
      setInterventions(items);
      setListError(lastListError || "");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { if (technicien) loadAll(); }, [technicien, loadAll]);
  useEffect(() => { if (!technicien) return; (async () => { const cs = await getCompanySettings(); if (cs) setCompany(cs); })(); }, [technicien]);

  const handleSaveCompany = async (c2) => { const ok = await saveCompanySettings(c2); if (ok) setCompany(c2); return ok; };
  const openNew = () => { setDraft(blankIntervention(technicien)); setCurrentId(null); setView("form"); };
  const openEdit = (id) => { const it = interventions.find((i) => i.id === id); if (it) { setDraft(JSON.parse(JSON.stringify(it))); setCurrentId(id); setView("form"); } };
  const openDetail = (id) => { setCurrentId(id); setView("detail"); };
  const duplicate = async (id) => {
    const it = interventions.find((i) => i.id === id); if (!it) return;
    const copy = { ...JSON.parse(JSON.stringify(it)), id: uid(), numero: genNumero(), status: "brouillon", createdAt: todayISO(), updatedAt: todayISO() };
    if (await saveInterventionData(copy.id, copy)) await loadAll();
  };
  const remove = async (id) => { await deleteInterventionData(id); await loadAll(); };
  const handleSave = async (data) => {
    const ok = await saveInterventionData(data.id, data);
    if (ok) { await loadAll(); setDraft(data); setCurrentId(data.id); }
    return ok;
  };

  if (!technicien) return <LoginScreen onLogin={setTechnicien} />;

  const current = interventions.find((i) => i.id === currentId) || draft;

  return (
    <div className="min-h-screen" style={{ background: c.paper }}>
      <header className="border-b print-hide" style={{ borderColor: c.line, background: c.ink }}>
        <div className="max-w-6xl mx-auto px-6 py-3 flex items-center gap-3">
          {company.logo ? <img src={company.logo} alt="Logo" className="rounded" style={{ width: 32, height: 32, objectFit: "contain", background: "#fff" }} /> : <div className="w-8 h-8 rounded-md flex items-center justify-center" style={{ background: c.copper }}><IWind size={16} color="#fff" /></div>}
          <div className="flex-1 min-w-0">
            <p className="text-sm font-bold text-white truncate" style={{ ...display }}>{company.nom || "Klimacool"}</p>
            <p className="text-xs truncate" style={{ color: c.mutedSoft }}>{technicien} · {fbReady ? "Base partagée" : "Mode local"} · {APP_VERSION}</p>
          </div>
          <button onClick={() => setView("settings")} title="Paramètres de l'entreprise" className="rounded-md p-2 shrink-0" style={{ background: "rgba(255,255,255,0.08)", color: "#fff" }}><ISettings size={16} /></button>
        </div>
      </header>
      {view === "dashboard" && <Dashboard interventions={interventions} loading={loading} listError={listError} onOpen={openDetail} onNew={openNew} onEdit={openEdit} onDuplicate={duplicate} onDelete={remove} technicien={technicien} />}
      {view === "form" && draft && (
        <InterventionForm
          initial={draft}
          onCancel={() => setView(currentId ? "detail" : "dashboard")}
          onSave={handleSave}
          onFinalized={() => {
            setView("detail");
            setTimeout(() => window.print(), 700);
          }}
        />
      )}
      {view === "detail" && current && <DetailView data={current} company={company} onBack={() => setView("dashboard")} onEdit={() => openEdit(current.id)} />}
      {view === "settings" && <CompanySettingsView initial={company} onBack={() => setView("dashboard")} onSave={handleSaveCompany} />}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  console.error(e);
  document.getElementById("root").innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#ECEFEA;color:#B23A2E;font-family:Arial,sans-serif;padding:24px;text-align:center;">Erreur au démarrage : ' + (e && e.message ? e.message : e) + '</div>';
}
</script>
</body>
</html>
