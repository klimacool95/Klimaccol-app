<div id="root">

    <p style="font-size:13px;color:#6B7480;margin:0;">Si cet écran reste affiché plus de 15 secondes, une erreur s'est produite.</p>
    <pre id="error-box" style="display:none;margin-top:16px;text-align:left;background:#F4DEDB;color:#B23A2E;padding:12px;border-radius:8px;font-size:11px;max-width:100%;overflow:auto;white-space:pre-wrap;"></pre>

<script>
  window.onerror = function (message, source, lineno, colno, error) {
    var box = document.getElementById("error-box");
    if (box) {
      box.style.display = "block";
      box.textContent = "Erreur : " + message + "\n(ligne " + lineno + ")";
    }
    return false;
  };
  setTimeout(function () {
    var box = document.getElementById("error-box");
    if (box && document.getElementById("fallback") && !box.textContent) {
      box.style.display = "block";
      box.textContent = "Le chargement prend trop de temps. Vérifiez votre connexion internet, ou essayez avec le WiFi plutôt que les données mobiles (ou l'inverse).";
    }
  }, 15000);
</script>

function localGetAll() {

function localSaveAll(list) {

async function listInterventions() {

    const snap = await db.collection("interventions").get();

let lastSaveError = null;
async function saveInterventionData(id, data) {
  lastSaveError = null;
  if (fbReady) {
    try { await db.collection("interventions").doc(id).set(data); return true; }
    catch (e) { console.error(e); lastSaveError = (e && e.message) || String(e); return false; }
  }
  try {
    const list = localGetAll();
    const idx = list.findIndex((i) => i.id === id);
    if (idx >= 0) list[idx] = data; else list.push(data);
    const ok = localSaveAll(list);
    if (!ok) lastSaveError = "Stockage local indisponible (mode navigation privée ?)";
    return ok;
  } catch (e) {
    lastSaveError = (e && e.message) || String(e);
    return false;
  }
}
async function deleteInterventionData(id) {
  if (fbReady) {
    try { await db.collection("interventions").doc(id).delete(); return true; }
    catch (e) { return false; }

  const list = localGetAll().filter((i) => i.id !== id);
  return localSaveAll(list);
}

  if (!iso) return "—";
  const [y, m, d] = iso.split("-");

  return `${d}/${m}/${y}`;

function resizeImage(file, maxWidth = 700, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function PhotoUpload({ value, onChange, label, width = 160, height = 120, maxWidth = 700, quality = 0.6 }) {
  const inputRef = useRef(null);

      )}

        accept="image/*"
        onChange={handleFile}
        style={{ position: "absolute", width: 1, height: 1, padding: 0, margin: -1, overflow: "hidden", clip: "rect(0,0,0,0)", whiteSpace: "nowrap", border: 0 }}

  );
}
function SignaturePad({ value, onChange }) {
  const canvasRef = useRef(null);

    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");

    if (value) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height); img.src = value; }
  }, []);
  const pos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  };
  const start = (e) => { drawing.current = true; const { x, y } = pos(e); const ctx = canvasRef.current.getContext("2d"); ctx.beginPath(); ctx.moveTo(x, y); };
  const move = (e) => { if (!drawing.current) return; e.preventDefault(); const { x, y } = pos(e); const ctx = canvasRef.current.getContext("2d"); ctx.lineTo(x, y); ctx.strokeStyle = c.ink; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.stroke(); };
  const end = () => { if (!drawing.current) return; drawing.current = false; onChange(canvasRef.current.toDataURL("image/png")); };
  const clear = () => { const canvas = canvasRef.current; const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); onChange(null); };
  return (
    <div>
      <canvas ref={canvasRef} width={420} height={140} className="w-full border rounded-md touch-none" style={{ borderColor: c.line, background: "#fff", cursor: "crosshair" }}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end} onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
      <button type="button" onClick={clear} className="mt-2 text-xs underline" style={{ color: c.muted }}>Effacer la signature</button>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if (!name.trim()) return;
    setBusy(true); setError("");
    try {
      if (fbReady) await firebase.auth().signInAnonymously();
      localStorage.setItem("klimacool-tech-name", name.trim());
      onLogin(name.trim());
    } catch (e) {
      setError("Connexion impossible. Vérifiez la configuration Firebase.");
    }
    setBusy(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-6" style={{ background: c.ink }}>
      <div className="w-full max-w-sm">
        <div className="flex flex-col items-center mb-8">
          <div className="w-14 h-14 rounded-xl flex items-center justify-center mb-3" style={{ background: c.copper }}>
            <IWind size={26} color="#fff" />
          </div>
          <h1 className="text-2xl font-bold text-white" style={{ ...display }}>Klimacool</h1>
          <p className="text-sm" style={{ color: c.mutedSoft }}>Suivi des visites techniques PAC Air/Air</p>
        </div>
        <div className="rounded-xl p-5" style={{ background: c.surface }}>
          <Field label="Votre nom (technicien)">
            <TextInput value={name} onChange={(e) => setName(e.target.value)} placeholder="ex : Kévin Garreau" onKeyDown={(e) => e.key === "Enter" && submit()} autoFocus />
          </Field>
          {error && <p className="text-xs mt-2" style={{ color: c.danger }}>{error}</p>}
          {!fbReady && <p className="text-xs mt-2" style={{ color: c.mutedSoft }}>Mode local (Firebase non configuré) — les fiches restent sur cet appareil uniquement.</p>}
          <button onClick={submit} disabled={busy || !name.trim()} className="w-full mt-4 py-2.5 rounded-md text-sm font-semibold" style={{ background: c.copper, color: "#fff", opacity: busy || !name.trim() ? 0.6 : 1 }}>
            {busy ? "Connexion…" : "Entrer"}
          </button>
        </div>
      </div>
    </div>
  );
}

                          <Field label="Pompe de relevage"><SelectInput value={ui.pompeRelevage} onChange={(v) => updateUI(ueIndex, uiIndex, { pompeRelevage: v })} options={POMPE_OPTIONS} /></Field>
                          <Field label="Détuilage"><ToggleOuiNon value={ui.detuilage} onChange={(v) => updateUI(ueIndex, uiIndex, { detuilage: v })} /></Field>
                          <Field label="Respect des préconisations autour de l'UI"><ToggleOuiNon value={ui.respectPreco} onChange={(v) => updateUI(ueIndex, uiIndex, { respectPreco: v })} /></Field>
                        </div>
                        <PhotoUpload label="Emplacement de l'unité dans la pièce" value={ui.photo} onChange={(v) => updateUI(ueIndex, uiIndex, { photo: v })} />
                        <div className="mt-4"><Field label="Commentaire de pose pour l'unité"><TextArea value={ui.commentaire} onChange={(e) => updateUI(ueIndex, uiIndex, { commentaire: e.target.value })} /></Field></div>
                      </div>
                    </div>
                  ))}
                  <button onClick={() => addUI(ueIndex)} className="self-start inline-flex items-center gap-1.5 text-sm font-semibold" style={{ color: c.steelDark }}><IPlus size={14} /> Ajouter une unité intérieure</button>
                </div>
              </div>
            </div>
          ))}
          <button onClick={addUE} className="self-start inline-flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold" style={{ background: c.copperTint, color: c.copperDark }}><IPlus size={15} /> Ajouter une unité extérieure</button>
        </div>
        <div className="mt-6 pt-4 border-t" style={{ borderColor: c.lineSoft }}>
          <Field label="Souhaitez-vous poser des radiateurs électriques ?"><ToggleOuiNon value={data.radiateursElectriques} onChange={(v) => set({ radiateursElectriques: v })} /></Field>
        </div>
      </Card>

      <Card>
        <SectionHeader n={4} title="Commande de matériel" subtitle="Liste des fournitures pour le devis" accent="steel" />
        <div className="flex flex-col gap-2">
          <div className="hidden sm:grid grid-cols-12 gap-2 text-xs font-semibold uppercase px-1" style={{ color: c.mutedSoft, letterSpacing: "0.06em" }}>
            <span className="col-span-7">Fourniture</span><span className="col-span-2">Quantité</span><span className="col-span-2">Validation</span>
          </div>
          {data.fournitures.map((f, i) => (
            <div key={f.id} className="grid grid-cols-12 gap-2 items-center">
              <div className="col-span-12 sm:col-span-7"><TextInput value={f.designation} onChange={(e) => updateFourniture(i, { designation: e.target.value })} placeholder="ex : Groupe extérieur inverter multi-split…" /></div>
              <div className="col-span-5 sm:col-span-2"><TextInput type="number" value={f.quantite} onChange={(e) => updateFourniture(i, { quantite: e.target.value })} /></div>
              <div className="col-span-5 sm:col-span-2"><SelectInput value={f.validation} onChange={(v) => updateFourniture(i, { validation: v })} options={["Ok", "En attente", "À revoir"]} /></div>
              <div className="col-span-2 sm:col-span-1 flex justify-end"><button onClick={() => removeFourniture(i)} className="rounded-md p-2" style={{ background: c.dangerTint, color: c.danger }}><ITrash size={14} /></button></div>
            </div>
          ))}
          <button onClick={addFourniture} className="self-start inline-flex items-center gap-1.5 text-sm font-semibold mt-1" style={{ color: c.copperDark }}><IPlus size={14} /> Ajouter une fourniture</button>
        </div>
      </Card>

      <Card>
        <SectionHeader n={5} title="Remarques et signature" subtitle="Finalisation de la fiche de visite" />
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div className="sm:col-span-2"><Field label="Remarques générales"><TextArea value={data.remarquesGenerales} onChange={(e) => set({ remarquesGenerales: e.target.value })} /></Field></div>
          <div className="sm:col-span-2"><Field label="Autres commentaires pour le chargé d'affaires"><TextArea value={data.autresCommentaires} onChange={(e) => set({ autresCommentaires: e.target.value })} /></Field></div>
          <Field label="Souhaitez-vous être recontacté par le chargé d'affaires ?"><ToggleOuiNon value={data.recontacte} onChange={(v) => set({ recontacte: v })} /></Field>
          <Field label="Voulez-vous joindre des photos supplémentaires ?"><ToggleOuiNon value={data.photosSupp} onChange={(v) => set({ photosSupp: v })} /></Field>
          <Field label="Date provisoire de chantier (vue avec le client)"><TextInput type="date" value={data.dateProvisoireChantier} onChange={(e) => set({ dateProvisoireChantier: e.target.value })} /></Field>
        </div>
        <Field label="Signature du technicien"><SignaturePad value={data.signature} onChange={(v) => set({ signature: v })} /></Field>
      </Card>

      <div className="fixed bottom-0 left-0 right-0 border-t bg-white px-6 py-3 flex items-center justify-between gap-3" style={{ borderColor: c.line }}>
        <span className="text-xs flex-1" style={{ color: saveError ? c.danger : (savedFlash ? c.success : c.mutedSoft) }}>
          {saveError ? `⚠ ${saveError}` : savedFlash ? "✓ Enregistré" : saving ? "Enregistrement…" : `Dernière modification : ${formatDateFR(data.updatedAt)}`}
        </span>
        <div className="flex gap-2 shrink-0">
          <button disabled={saving} onClick={() => doSave("brouillon")} className="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold" style={{ background: c.lineSoft, color: c.text, opacity: saving ? 0.6 : 1 }}><ISave size={15} /> Enregistrer le brouillon</button>
          <button disabled={saving} onClick={() => doSave("finalise")} className="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold" style={{ background: c.copper, color: "#fff", opacity: saving ? 0.6 : 1 }}><ICheck size={15} /> Finaliser la fiche</button>
        </div>
      </div>
    </div>
  );
}

/* ================================================================== */
/*  FICHE DÉTAIL / IMPRESSION                                           */
/* ================================================================== */
function DetailView({ data, company, onBack, onEdit }) {
  const { ue: ueCount, ui: uiCount } = countUnits(data);
  const hasCompany = company && (company.nom || company.logo || company.adresse || company.telephone || company.email);
  return (
    <div>
      <div className="max-w-4xl mx-auto px-6 pt-8 flex items-center justify-between print-hide">
        <button onClick={onBack} className="inline-flex items-center gap-1 text-sm font-medium" style={{ color: c.muted }}><IArrowLeft size={15} /> Retour</button>
        <div className="flex gap-2">
          <button onClick={onEdit} className="inline-flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold" style={{ background: c.lineSoft, color: c.text }}><IPencil size={14} /> Modifier</button>
          <button onClick={() => window.print()} className="inline-flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold" style={{ background: c.copper, color: "#fff" }}><IPrinter size={14} /> Imprimer / PDF</button>
        </div>
      </div>
      <div id="print-area" className="max-w-4xl mx-auto px-6 py-8" style={{ color: c.text }}>
        {hasCompany && (
          <div className="flex items-center gap-4 pb-5 mb-5 border-b" style={{ borderColor: c.lineSoft }}>
            {company.logo && <img src={company.logo} alt="Logo" style={{ maxWidth: 140, maxHeight: 70, objectFit: "contain" }} />}
            <div className="text-xs leading-relaxed" style={{ color: c.muted }}>
              {company.nom && <p className="font-bold text-sm" style={{ color: c.text }}>{company.nom}</p>}
              {company.adresse && <p>{company.adresse}</p>}
              <p>{[company.telephone, company.email].filter(Boolean).join(" · ")}</p>
              {company.siret && <p style={mono}>SIRET {company.siret}</p>}
            </div>
          </div>
        )}
        <div className="flex items-start justify-between border-b-2 pb-5 mb-6" style={{ borderColor: c.ink }}>
          <div>
            <p className="text-xs font-semibold uppercase" style={{ color: c.copper, letterSpacing: "0.1em" }}>Rapport d'intervention</p>
            <h1 className="text-2xl font-bold" style={{ ...display }}>Visite technique — PAC Air / Air</h1>
          </div>
          <div className="text-right text-xs" style={{ ...mono, color: c.muted }}><p>N° {data.numero}</p><p>{formatDateFR(data.dateVT)}</p></div>
        </div>
        <DetailRow label="Installateur" value={data.installateur} />
        <DetailRow label="Technicien" value={data.technicien} />
        <DetailRow label="Client" value={data.client} />
        <DetailRow label="Adresse" value={data.adresse} />
        <DetailSection title="Installation électrique">
          <DetailRow label="Surface habitable totale" value={data.surfaceHabitable ? `${data.surfaceHabitable} m²` : ""} />
          <DetailRow label="Tension d'alimentation actuelle" value={data.tension} />
          <DetailRow label="Section du câble disjoncteur → TGBT" value={data.sectionCable} />
          <DetailRow label="TGBT dispose d'un inter différentiel" value={data.tgbtDiff} />
          <DetailRow label="Remplacement câble d'alimentation TGBT" value={data.remplacementCable} />
          <DetailRow label="Mise à la terre conforme" value={data.miseATerre} />
          {data.photoTableau && <PhotoRow label="Tableau électrique principal" src={data.photoTableau} />}
        </DetailSection>
        <DetailSection title={`Unités extérieures (${ueCount}) & intérieures (${uiCount})`}>
          {data.unitesExterieures.map((ue, i) => (
            <div key={ue.id} className="mb-5 rounded-lg border" style={{ borderColor: c.line }}>
              <div className="px-4 py-2 font-bold text-sm" style={{ background: c.copperTint, color: c.copperDark }}>Unité extérieure {i + 1}</div>
              <div className="p-4">
                <DetailRow label="Exposition" value={ue.exposition} />
                <DetailRow label="Hauteur de pose" value={ue.hauteurPose ? `${ue.hauteurPose} m` : ""} />
                <DetailRow label="Type de support" value={ue.typeSupport} />
                {ue.typeSupport === "Rubber foot" ? <DetailRow label="Dalle béton" value={ue.dalleBeton} /> : <DetailRow label="Nature du mur" value={ue.natureMur} />}
                <DetailRow label="Longueur câble électrique" value={ue.longueurCableElec ? `${ue.longueurCableElec} m` : ""} />
                <DetailRow label="Longueur liaison frigorifique totale" value={ue.longueurLiaisonFrigoTotale ? `${ue.longueurLiaisonFrigoTotale} m` : ""} />
                <DetailRow label="Respect des préconisations" value={ue.respectPreco} />
                {ue.photo && <PhotoRow label="Emplacement façade" src={ue.photo} />}
                {ue.unitesInterieures.map((ui, j) => (
                  <div key={ui.id} className="mt-4 rounded-md border ml-0 sm:ml-4" style={{ borderColor: c.steel }}>
                    <div className="px-3 py-1.5 font-semibold text-xs" style={{ background: c.steelTint, color: c.steelDark }}>Unité intérieure {j + 1} — {ui.pieceConcernee || "pièce non renseignée"}</div>
                    <div className="p-3">
                      <DetailRow label="Type d'unité" value={ui.typeUnite} />
                      <DetailRow label="Hauteur sous plafond" value={ui.hauteurPlafond ? `${ui.hauteurPlafond} m` : ""} />
                      <DetailRow label="Surface de la pièce" value={ui.surfacePiece ? `${ui.surfacePiece} m²` : ""} />
                      <DetailRow label="Longueur liaison frigorifique" value={ui.longueurLiaisonFrigo ? `${ui.longueurLiaisonFrigo} m` : ""} />
                      <DetailRow label="Nature du mur" value={ui.natureMur} />
                      <DetailRow label="Difficulté de percement" value={ui.difficultePercement} />
                      <DetailRow label="Pompe de relevage" value={ui.pompeRelevage} />
                      <DetailRow label="Détuilage" value={ui.detuilage} />
                      <DetailRow label="Respect des préconisations" value={ui.respectPreco} />
                      {ui.commentaire && <DetailRow label="Commentaire de pose" value={ui.commentaire} />}
                      {ui.photo && <PhotoRow label="Emplacement dans la pièce" src={ui.photo} />}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}
          <DetailRow label="Pose de radiateurs électriques" value={data.radiateursElectriques} />
        </DetailSection>
        <DetailSection title="Commande de matériel">
          <table className="w-full text-sm border-collapse">
            <thead><tr style={{ background: c.lineSoft }}><th className="text-left px-3 py-2 font-semibold" style={{ color: c.muted }}>Fourniture</th><th className="text-left px-3 py-2 font-semibold" style={{ color: c.muted }}>Quantité</th><th className="text-left px-3 py-2 font-semibold" style={{ color: c.muted }}>Validation</th></tr></thead>
            <tbody>{data.fournitures.filter((f) => f.designation).map((f) => (<tr key={f.id} className="border-b" style={{ borderColor: c.lineSoft }}><td className="px-3 py-2">{f.designation}</td><td className="px-3 py-2" style={mono}>{f.quantite}</td><td className="px-3 py-2">{f.validation}</td></tr>))}</tbody>
          </table>
        </DetailSection>
        <DetailSection title="Remarques et signature">
          {data.remarquesGenerales && <DetailRow label="Remarques générales" value={data.remarquesGenerales} />}
          {data.autresCommentaires && <DetailRow label="Autres commentaires" value={data.autresCommentaires} />}
          <DetailRow label="Recontact souhaité" value={data.recontacte} />
          <DetailRow label="Photos supplémentaires" value={data.photosSupp} />
          <DetailRow label="Date provisoire de chantier" value={formatDateFR(data.dateProvisoireChantier)} />
          {data.signature ? (<div className="mt-3"><p className="text-xs font-semibold uppercase mb-1" style={{ color: c.mutedSoft, letterSpacing: "0.06em" }}>Signature du technicien</p><img src={data.signature} alt="signature" style={{ width: 220, background: "#fff" }} /></div>) : (<p className="text-xs italic mt-2" style={{ color: c.mutedSoft }}>Non signée</p>)}
        </DetailSection>
      </div>
    </div>
  );
}
function DetailSection({ title, children }) {
  return <div className="mb-6 pt-5 border-t" style={{ borderColor: c.lineSoft }}><h2 className="text-sm font-bold uppercase mb-3" style={{ color: c.ink, letterSpacing: "0.05em" }}>{title}</h2>{children}</div>;
}
function DetailRow({ label, value }) {
  if (!value) return null;
  return <div className="flex flex-col sm:flex-row sm:items-baseline gap-0.5 sm:gap-3 py-1 text-sm"><span className="sm:w-72 shrink-0" style={{ color: c.muted }}>{label}</span><span className="font-medium" style={{ color: c.text }}>{value}</span></div>;
}
function PhotoRow({ label, src }) {
  return <div className="mt-2"><p className="text-xs mb-1" style={{ color: c.mutedSoft }}>{label}</p><img src={src} alt={label} className="rounded-md border" style={{ width: 200, borderColor: c.line }} /></div>;
}

/* ================================================================== */
/*  RACINE DE L'APPLICATION                                             */
/* ================================================================== */
function App() {
  const [technicien, setTechnicien] = useState(() => localStorage.getItem("klimacool-tech-name") || null);
  const [view, setView] = useState("dashboard");
  const [interventions, setInterventions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [currentId, setCurrentId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [company, setCompany] = useState(blankCompany());

  const loadAll = useCallback(async () => {
    setLoading(true);
    setInterventions(await listInterventions());
    setLoading(false);
  }, []);

  useEffect(() => { if (technicien) loadAll(); }, [technicien, loadAll]);
  useEffect(() => { (async () => { const cs = await getCompanySettings(); if (cs) setCompany(cs); })(); }, [technicien]);

  const handleSaveCompany = async (c2) => { const ok = await saveCompanySettings(c2); if (ok) setCompany(c2); return ok; };
  const openNew = () => { setDraft(blankIntervention(technicien)); setCurrentId(null); setView("form"); };
  const openEdit = (id) => { const it = interventions.find((i) => i.id === id); if (it) { setDraft(JSON.parse(JSON.stringify(it))); setCurrentId(id); setView("form"); } };
  const openDetail = (id) => { setCurrentId(id); setView("detail"); };
  const duplicate = async (id) => {
    const it = interventions.find((i) => i.id === id); if (!it) return;
    const copy = { ...JSON.parse(JSON.stringify(it)), id: uid(), numero: genNumero(), status: "brouillon", createdAt: todayISO(), updatedAt: todayISO() };
    if (await saveInterventionData(copy.id, copy)) await loadAll();
  };
  const remove = async (id) => { await deleteInterventionData(id); await loadAll(); };
  const handleSave = async (data) => {
    const ok = await saveInterventionData(data.id, data);
    if (ok) { await loadAll(); setDraft(data); setCurrentId(data.id); }
    return ok;
  };

  if (!technicien) return <LoginScreen onLogin={setTechnicien} />;

  const current = interventions.find((i) => i.id === currentId) || draft;

  return (
    <div className="min-h-screen" style={{ background: c.paper }}>
      <header className="border-b print-hide" style={{ borderColor: c.line, background: c.ink }}>
        <div className="max-w-6xl mx-auto px-6 py-3 flex items-center gap-3">
          {company.logo ? <img src={company.logo} alt="Logo" className="rounded" style={{ width: 32, height: 32, objectFit: "contain", background: "#fff" }} /> : <div className="w-8 h-8 rounded-md flex items-center justify-center" style={{ background: c.copper }}><IWind size={16} color="#fff" /></div>}
          <div className="flex-1 min-w-0">
            <p className="text-sm font-bold text-white truncate" style={{ ...display }}>{company.nom || "Klimacool"}</p>
            <p className="text-xs truncate" style={{ color: c.mutedSoft }}>{technicien} · {fbReady ? "Base partagée" : "Mode local"}</p>
          </div>
          <button onClick={() => setView("settings")} title="Paramètres de l'entreprise" className="rounded-md p-2 shrink-0" style={{ background: "rgba(255,255,255,0.08)", color: "#fff" }}><ISettings size={16} /></button>
        </div>
      </header>
      {view === "dashboard" && <Dashboard interventions={interventions} loading={loading} onOpen={openDetail} onNew={openNew} onEdit={openEdit} onDuplicate={duplicate} onDelete={remove} technicien={technicien} />}
      {view === "form" && draft && (
        <InterventionForm
          initial={draft}
          onCancel={() => setView(currentId ? "detail" : "dashboard")}
          onSave={handleSave}
          onFinalized={() => {
            setView("detail");
            setTimeout(() => window.print(), 700);
          }}
        />
      )}
      {view === "detail" && current && <DetailView data={current} company={company} onBack={() => setView("dashboard")} onEdit={() => openEdit(current.id)} />}
      {view === "settings" && <CompanySettingsView initial={company} onBack={() => setView("dashboard")} onSave={handleSaveCompany} />}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  console.error(e);
  document.getElementById("root").innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#ECEFEA;color:#B23A2E;font-family:Arial,sans-serif;padding:24px;text-align:center;">Erreur au démarrage : ' + (e && e.message ? e.message : e) + '</div>';
}
</script>
</body>
</html>
